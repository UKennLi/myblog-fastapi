[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "myblog-fastapi"
version = "1.0.0"
description = "MyBlog-butterfly compatible FastAPI and MySQL migration"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.4",
  "PyMySQL==1.2.3",
  "cryptography==50.0.2",
  "Jinja2==3.1.6",
  "pydantic-settings==2.15.0",
  "bcrypt==5.0.0",
  "markdown-it-py==4.2.0",
  "python-multipart==0.0.32",
  "Pillow==12.3.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
