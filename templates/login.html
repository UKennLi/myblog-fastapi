<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
<meta content="" name="description"/>
<meta content="" name="author"/>
<title>Please sign in</title>
<link href="/default-ui.css" rel="stylesheet"/>
</head>
<body>
<div class="content">
<form action="/login" class="login-form" method="post">
<h2>Please sign in</h2>
{% if param.error %}<div class="alert alert-danger" role="alert">Invalid credentials</div>{% endif %}
{% if param.logout %}<div class="alert alert-success" role="alert">You have been signed out</div>{% endif %}
<p>
<label class="screenreader" for="username">Username</label>
<input autofocus="" id="username" name="username" placeholder="Username" required="" type="text"/>
</p>
<p>
<label class="screenreader" for="password">Password</label>
<input id="password" name="password" placeholder="Password" required="" type="password"/>
</p>
<input name="_csrf" type="hidden" value="{{ csrf_token }}">
<button class="primary" type="submit">Sign in</button>
</form>
</div>
</body>
</html>
