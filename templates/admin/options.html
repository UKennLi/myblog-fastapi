{% extends "admin/layout/admin.html" %}
{% set title = '系统设置' %}
{% block content %}
<div id="main-content">
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
<h1 class="h2">系统设置</h1>
</div>
<form method="post" action="/admin/options/save">
{% if csrf_token %}<input type="hidden" name="_csrf" value="{{ csrf_token }}">{% endif %}

<div class="card mb-4">
<div class="card-header">站点信息</div>
<div class="card-body">
<div class="mb-3 row">
<label class="col-sm-2 col-form-label">站点标题</label>
<div class="col-sm-10">
<input type="text" class="form-control" name="site_title" value="{{ site_title }}">
</div>
</div>
<div class="mb-3 row">
<label class="col-sm-2 col-form-label">站点描述</label>
<div class="col-sm-10">
<input type="text" class="form-control" name="site_description" value="{{ site_description }}">
</div>
</div>
<div class="mb-3 row">
<label class="col-sm-2 col-form-label">Logo URL</label>
<div class="col-sm-10">
<input type="text" class="form-control" name="site_logo" placeholder="输入图片URL，可使用上传功能获取" value="{{ site_logo }}">
</div>
</div>
<div class="mb-3 row">
<label class="col-sm-2 col-form-label">Favicon URL</label>
<div class="col-sm-10">
<input type="text" class="form-control" name="site_favicon" placeholder="浏览器标签页图标URL" value="{{ site_favicon }}">
</div>
</div>
<div class="mb-3 row">
<label class="col-sm-2 col-form-label">ICP备案号</label>
<div class="col-sm-10">
<input type="text" class="form-control" name="icp_beian" value="{{ icp_beian }}">
</div>
</div>
</div>
</div>
<div class="card mb-4">
<div class="card-header">博主信息</div>
<div class="card-body">
<div class="mb-3 row">
<label class="col-sm-2 col-form-label">昵称</label>
<div class="col-sm-10">
<input type="text" class="form-control" name="author_name" value="{{ author_name }}">
</div>
</div>
<div class="mb-3 row">
<label class="col-sm-2 col-form-label">个人描述</label>
<div class="col-sm-10">
<input type="text" class="form-control" name="author_description" value="{{ author_description }}">
</div>
</div>
<div class="mb-3 row">
<label class="col-sm-2 col-form-label">头像 URL</label>
<div class="col-sm-10">
<input type="text" class="form-control" name="author_avatar" value="{{ author_avatar }}">
</div>
</div>
</div>
</div>
<div class="card mb-4">
<div class="card-header">侧边栏设置</div>
<div class="card-body">
<div class="mb-3 row">
<label class="col-sm-2 col-form-label">站点公告</label>
<div class="col-sm-10">
<textarea class="form-control" name="site_announcement" rows="4">{{ site_announcement }}</textarea>
<div class="form-text">支持 HTML 代码</div>
</div>
</div>
</div>
</div>
<div class="mb-5">
<button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-save me-2"></i>保存设置</button>
</div>
</form>
</div>
{% endblock %}
