<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css">
<link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css">
<style>
        /* 简单的后台样式 */
        .sidebar {
            height: 100vh;
            background-color: #343a40;
            /* 固定侧边栏，防止随主体内容滚动 */
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 48px 0 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
        }
        .sidebar .nav-link {
            color: #adb5bd;
        }
        .sidebar .nav-link.active {
            color: #fff;
            background-color: #0d6efd;
        }
        /* 主体内容区域，需要留出侧边栏的宽度 */
        main {
            margin-left: 16.666667%; /* 对应 col-md-3/col-lg-2 的大概宽度，Bootstrap会自动处理，这里只是确保在大屏下不被遮挡 */
            min-height: 100vh;
            overflow-y: auto;
        }
        @media (max-width: 767.98px) {
             .sidebar {
                 position: static;
                 height: auto;
                 padding-top: 0;
             }
             main {
                 margin-left: 0;
             }
        }
    </style>
</head>
<body>
<div class="container-fluid">
<div class="row">
<nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
<div class="position-sticky pt-3">
<h4 class="text-white px-3 py-2 text-center">博客管理</h4>
<hr class="text-white">
<ul class="nav flex-column">
<li class="nav-item">
<a class="nav-link {{ ('active' if currentURI == '/admin'  or  currentURI == '/admin/'  or  currentURI == '/admin/index' else '') }}" href="/admin">
<i class="bi bi-speedometer2 me-2"></i> 仪表盘
						</a>
</li>
<li class="nav-item">
<a class="nav-link {{ ('active' if string_contains(currentURI, '/admin/posts') else '') }}" href="/admin/posts">
<i class="bi bi-file-earmark-text me-2"></i> 文章管理
						</a>
</li>
<li class="nav-item">
<a class="nav-link {{ ('active' if string_contains(currentURI, '/admin/drafts') else '') }}" href="/admin/drafts">
<i class="bi bi-inbox me-2"></i> 草稿箱
                        </a>
</li>
<li class="nav-item">
<a class="nav-link {{ ('active' if string_contains(currentURI, '/admin/comments') else '') }}" href="/admin/comments">
<i class="bi bi-chat-dots me-2"></i> 评论管理
					    </a>
</li>
<li class="nav-item">
<!-- ✨ 新增：关于管理 ✨ -->
<a class="nav-link {{ ('active' if string_contains(currentURI, '/admin/about') else '') }}" href="/admin/about">
<i class="bi bi-person-vcard me-2"></i> 关于管理
                        </a>
</li>
<h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase">
<span>系统</span>
</h6>
<ul class="nav flex-column mb-2">
<li class="nav-item">
<a class="nav-link {{ ('active' if string_contains(currentURI, '/admin/options') else '') }}" href="/admin/options">
<i class="bi bi-gear-wide-connected me-2"></i> 系统设置
                            </a>
</li>
<li class="nav-item">
<a class="nav-link {{ ('active' if string_contains(currentURI, '/admin/links') else '') }}" href="/admin/links">
<i class="bi bi-link-45deg me-2"></i> 友链管理
                            </a>
</li>
<li class="nav-item">
<a class="nav-link {{ ('active' if string_contains(currentURI, '/admin/profile') else '') }}" href="/admin/profile">
<i class="bi bi-person-badge me-2"></i> 个人设置
                            </a>
</li>
</ul>
<li class="nav-item mt-3">
<h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase">
<span>操作</span>
</h6>
<form method="post" class="nav-link" action="/logout">
{% if csrf_token %}<input type="hidden" name="_csrf" value="{{ csrf_token }}">{% endif %}

<button type="submit" class="btn btn-link text-danger p-0 text-decoration-none w-100 text-start">
<i class="bi bi-box-arrow-right me-2"></i> 退出登录
                            </button>
</form>
</li>
</ul>
</div>
</nav>
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-3 bg-light">
{% block content %}{% endblock %}
</main>
</div>
</div>
<script src="/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
