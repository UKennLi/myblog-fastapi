{% extends "admin/layout/admin.html" %}
{% set title = '友链管理' %}
{% block content %}
<div id="main-content">
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
<h1 class="h2">友链管理</h1>
<div class="btn-toolbar mb-2 mb-md-0">
<a href="/admin/links/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg"></i> 添加友链</a>
</div>
</div>
<div class="table-responsive">
<table class="table table-striped table-hover align-middle">
<thead>
<tr><th>Logo</th><th>名称</th><th>地址</th><th>分组</th><th>排序</th><th>操作</th></tr>
</thead>
<tbody>
{% for link in pageInfo.list %}<tr>
<td><img width="32" height="32" class="rounded-circle" onerror="this.src=&#x27;/butterfly/img/friend_404.gif&#x27;" src="{{ link.logo }}"></td>
<td>{{ link.name }}</td>
<td><a target="_blank" href="{{ link.url }}">{{ link.url }}</a></td>
<td><span class="badge bg-info text-dark">{{ link.team }}</span></td>
<td>{{ link.sort }}</td>
<td>
<a class="btn btn-sm btn-outline-primary" href="{{ '/admin/links/edit/' ~ link.id }}">编辑</a>
<form method="post" style="display:inline;" onsubmit="return confirm(&#x27;确定删除？&#x27;);" action="{{ '/admin/links/delete/' ~ link.id }}">
{% if csrf_token %}<input type="hidden" name="_csrf" value="{{ csrf_token }}">{% endif %}

<button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
</form>
</td>
</tr>{% endfor %}
</tbody>
</table>
</div>
</div>
{% endblock %}
